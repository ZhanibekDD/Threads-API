name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt
          test_status=${PIPESTATUS[0]}
          echo "exit_code=$test_status" >> "$GITHUB_OUTPUT"
          exit "$test_status"
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          retention-days: 3
